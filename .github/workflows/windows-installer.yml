name: windows-installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the installer
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          ./installer/build.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Harness-Setup-win-x64
          path: artifacts/installer/RPG-Harness-Setup-win-x64.exe
          if-no-files-found: error
